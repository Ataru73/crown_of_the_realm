<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Saxon and Norman lords fight for the crown of medieval England: a turn-based campaign with arcade jousts, sword fights, sieges and battles." />
    <title>Crown of the Realm</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      /* Touch goes to the game: no scrolling, zooming, text selection or callouts. */
      body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #game { width: 100%; height: 100%; }
      #controls { position: fixed; right: 8px; bottom: 8px; z-index: 1; display: flex; gap: 6px; }
      #controls button {
        min-width: 34px; min-height: 34px;
        font-size: 18px; line-height: 1; padding: 4px 6px; cursor: pointer; color: #f4e4bc;
        background: rgba(0, 0, 0, 0.5); border: 1px solid #8a6a3a; border-radius: 4px;
      }
      noscript { color: #f4e4bc; font-family: Georgia, serif; display: block; padding: 2em; text-align: center; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <noscript>Crown of the Realm needs JavaScript to run.</noscript>
    <div id="controls">
      <button id="settings" title="Settings (Esc)" aria-label="Settings">⚙</button>
      <button id="mute" title="Sound on/off (M)" aria-label="Sound on/off">🔊</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
