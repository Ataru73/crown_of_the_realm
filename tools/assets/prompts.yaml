    frames: 2
    scale: 2.0
    alpha_cutoff: 50
    tint: true

  - id: swordsman_guard_strike
    kind: render
    frames: 2
    scale: 2.0
    alpha_cutoff: 50
    tint: true

  - id: swordsman_guard_parry
    kind: render
    frames: 2
    scale: 2.0
    alpha_cutoff: 50
    tint: true

  - id: swordsman_guard_hit
    kind: render
    frames: 2
    scale: 2.0
    alpha_cutoff: 50
