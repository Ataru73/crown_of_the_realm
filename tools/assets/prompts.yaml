    alpha_cutoff: 50
    tint: false

  - id: wall_course_1
    kind: render
    frames: 3
    scale: 10.0
    alpha_cutoff: 50
    tint: false

  - id: wall_course_2
    kind: render
    frames: 3
    scale: 10.0
    alpha_cutoff: 50
    tint: false

